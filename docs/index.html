<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e62117">
<title>発見ツベ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="発見ツベ">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>発見ツベ</h1><p>ふだん見ない動画に出会う</p></header>

<main>
  <nav id="genres" class="genres" aria-label="ジャンル"></nav>

  <form id="searchForm" class="search">
    <input id="q" type="search" maxlength="50" placeholder="ことばで探す（50文字まで）" enterkeyhint="search">
    <button type="submit" class="btn primary">検索</button>
  </form>
  <div id="recent" class="recent"></div>

  <section class="switches">
    <div class="sw" data-key="period" aria-label="期間">
      <button data-val="day">24時間以内</button>
      <button data-val="week">今週</button>
      <button data-val="month">今月</button>
    </div>
    <div class="sw" data-key="order" aria-label="並び">
      <button data-val="popular">人気順</button>
      <button data-val="random">ランダム</button>
    </div>
    <div class="sw" data-key="scope" aria-label="対象">
      <button data-val="jp">日本のみ</button>
      <button data-val="world">海外も含む</button>
    </div>
  </section>

  <p id="status" class="status" role="status"></p>
  <ul id="list" class="list"></ul>

  <button id="again" class="btn primary wide" hidden>別の動画を出す</button>
</main>

<script src="app.js"></script>
</body>
</html>
